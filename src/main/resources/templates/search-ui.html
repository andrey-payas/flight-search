<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Flight Search</title>
</head>
<body class="bg-gray-100">


<div class="max-w-5xl mx-auto p-8">

    <div th:replace="~{fragments/navigation :: navigation}"></div>

    <h1 class="text-3xl font-bold mb-6">
        Flight Search
    </h1>

    <div class="bg-white rounded-lg shadow p-6 space-y-4">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium">From</label>
                <input id="from"
                       class="mt-1 w-full border rounded p-2"
                       placeholder="WRO">
            </div>

            <div>
                <label class="block text-sm font-medium">To</label>
                <input id="to"
                       class="mt-1 w-full border rounded p-2"
                       placeholder="CA">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium">From Date</label>
                    <input id="from_date"
                           placeholder="2027-04-01"
                           class="mt-1 w-full border rounded p-2">
                </div>

                <div>
                    <label class="block text-sm font-medium">To Date</label>
                    <input id="to_date"
                           placeholder="2027-04-30"
                           class="mt-1 w-full border rounded p-2">
                </div>

            </div>

            <div>
                <label class="block text-sm font-medium">Stay duration (days)</label>
                <input id="stayDuration"
                       type="number"
                       min="0"
                       placeholder="10"
                       class="mt-1 w-full border rounded p-2">
            </div>

            <div>
                <label class="flex items-center gap-2 mt-6">
                    <input
                            id="roundtrip"
                            type="checkbox"
                            class="h-4 w-4 rounded border-gray-300">
                    <span class="text-sm font-medium">Round trip</span>
                </label>
            </div>

            <div>
                <label class="flex items-center gap-2 mt-6">
                    <input
                            id="return_kiwi_links"
                            type="checkbox"
                            class="h-4 w-4 rounded border-gray-300">
                    <span class="text-sm font-medium">Return Kiwi links</span>
                </label>
            </div>
        </div>

        <input id="minLayover"
               type="number"
               placeholder="Min Layover"
               class="border rounded p-2">

        <input id="maxLayover"
               type="number"
               placeholder="Max Layover"
               class="border rounded p-2">

        <details class="border rounded p-4">
            <summary class="cursor-pointer font-medium">
                Advanced penalties
            </summary>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">

                <input id="hopPenalty"
                       type="number"
                       placeholder="Hop penalty"
                       class="border rounded p-2">

                <input id="layoverPenalty"
                       type="number"
                       placeholder="Layover penalty"
                       class="border rounded p-2">

                <input id="flightTimePenalty"
                       type="number"
                       placeholder="Flight time penalty"
                       class="border rounded p-2">

            </div>
        </details>

        <button
                onclick="searchFlights()"
                class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
            Search
        </button>

    </div>

    <div id="loading"
         class="hidden mt-6 text-gray-500">
        Searching...
    </div>

    <div id="summary"
         class="mt-6 font-semibold text-lg"></div>

    <div id="results"
         class="mt-6 space-y-4"></div>

</div>

<script>

    function formatTime(arr) {
        return `${arr[0]}-${String(arr[1]).padStart(2, '0')}-${String(arr[2]).padStart(2, '0')}
            ${String(arr[3]).padStart(2, '0')}:${String(arr[4]).padStart(2, '0')}`;
    }

    async function searchFlights() {

        const params = new URLSearchParams();

        params.append("from", document.getElementById("from").value);
        params.append("to", document.getElementById("to").value);
        params.append("from_date", document.getElementById("from_date").value);
        params.append("to_date", document.getElementById("to_date").value);
        params.append("roundtrip", document.getElementById("roundtrip").checked);
        params.append("return_kiwi_links", document.getElementById("return_kiwi_links").checked);

        const optional = [
            ["min_layover", "minLayover"],
            ["max_layover", "maxLayover"],
            ["stay_duration", "stayDuration"],
            ["hop_penalty", "hopPenalty"],
            ["layover_penalty", "layoverPenalty"],
            ["flight_time_penalty", "flightTimePenalty"],
        ];

        optional.forEach(([requestName, inputId]) => {
            const value = document.getElementById(inputId).value;
            if (value !== "") {
                params.append(requestName, value);
            }
        });

        document.getElementById("loading").classList.remove("hidden");
        document.getElementById("results").innerHTML = "";
        document.getElementById("summary").innerHTML = "";

        const response = await fetch("/search-itineraries?" + params.toString());

        const flights = await response.json();

        document.getElementById("loading").classList.add("hidden");

        let total = 0;

        flights.forEach(f => total += f.price);

        document.getElementById("summary").innerHTML =
            `${flights.length} flights • Total price: €${total}`;

        const results = document.getElementById("results");

        flights.forEach(flight => {

            results.innerHTML += `
            <div class="bg-white rounded-lg shadow p-5">
                <div class="flex justify-between">
                    <div>
                       <div class="text-2xl font-bold">
                <div>
                    ${flight.fromAirportMunicipality}
                    (${flight.fromAirport})
                </div>
                <div class="text-gray-500 my-1">
                    ↓
                </div>
                <div>
                    ${flight.toAirportMunicipality}
                    (${flight.toAirport})
                </div>
            </div>

            <div class="mt-3 text-gray-600">

                <div>
                    Departure:
                    ${formatTime(flight.fromTime)}
                </div>

                <div>
                    Arrival:
                    ${formatTime(flight.toTime)}
                </div>
                <div>
                    Duration:
                    <span class="duration" data-total-seconds="${flight.duration}">
                    </span>
                </div>

            </div>

        </div>

        <div class="text-right">

            <div class="text-3xl font-bold text-green-600">
                €${flight.price}
            </div>

            <div class="text-xs text-gray-500 mt-2 break-all">
                ${flight.id}
            </div>

            <a
                href="${buildSkyScannerUrl(flight)}"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-block mt-4 bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded">
                View on Skyscanner
            </a>



    ${flight.kiwiLink ? `
    <a
        href="${flight.kiwiLink}"
        target="_blank"
        rel="noopener noreferrer"
        class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">
        View on Kiwi
    </a>
    ` : ""}

        </div>

    </div>

</div>
`;
        });


        document.querySelectorAll('.duration').forEach(element => {
            const seconds = Number(element.dataset.totalSeconds);

            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);

            element.textContent = `${hours}h ${minutes}m`;
        });
    }

    function formatSkyScannerDate(arr) {
        // YYMMDD
        return String(arr[0]).slice(2)
            + String(arr[1]).padStart(2, "0")
            + String(arr[2]).padStart(2, "0");
    }

    function buildSkyScannerUrl(flight) {
        return `https://www.skyscanner.com.ua/transport/flights/` +
            `${flight.fromAirport.toLowerCase()}/` +
            `${flight.toAirport.toLowerCase()}/` +
            `${formatSkyScannerDate(flight.fromTime)}/` +
            `?adultsv2=1` +
            `&cabinclass=economy` +
            `&childrenv2=` +
            `&ref=home` +
            `&rtn=0` +
            `&outboundaltsenabled=false` +
            `&inboundaltsenabled=false` +
            `&sortby=cheapest` +
            `&preferdirects=false`;
    }


</script>

</body>
</html>
