<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Prepare Heuristics</title>
</head>
<body class="bg-gray-100">

<div class="max-w-2xl mx-auto p-8">

    <div th:replace="~{fragments/navigation :: navigation}"></div>

    <h1 class="text-3xl font-bold mb-6">
        Prepare Heuristics
    </h1>

    <div class="bg-white rounded-lg shadow p-6 space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <div>
                <label class="block text-sm font-medium mb-1">
                    From Date
                </label>
                <input
                        id="fromDate"
                        placeholder="2027-04"
                        type="month"
                        class="w-full border rounded p-2">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">
                    To Date
                </label>
                <input
                        id="toDate"
                        placeholder="2027-04"
                        type="month"
                        class="w-full border rounded p-2">
            </div>

        </div>

        <label class="flex items-center gap-2">
            <input
                    id="projectionOnly"
                    type="checkbox"
                    class="h-4 w-4">
            <span>Projection only</span>
        </label>

        <label class="flex items-center gap-2">
            <input
                    id="allCountries"
                    type="checkbox"
                    class="h-4 w-4">
            <span>All countries</span>
        </label>

        <button
                onclick="prepareHeuristics()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded">
            Prepare
        </button>

    </div>

    <div id="loading" class="hidden mt-6 text-gray-600">
        Preparing heuristics...
    </div>

    <div id="message" class="mt-6"></div>

</div>

<script>

    async function prepareHeuristics() {

        const params = new URLSearchParams();

        params.append("fromDate", document.getElementById("fromDate").value);
        params.append("toDate", document.getElementById("toDate").value);
        params.append(
            "projectionOnly",
            document.getElementById("projectionOnly").checked
        );

        params.append(
            "allCountries",
            document.getElementById("allCountries").checked
        );

        const loading = document.getElementById("loading");
        const message = document.getElementById("message");

        loading.classList.remove("hidden");
        message.innerHTML = "";

        try {

            const response = await fetch("/prepare-heuristics", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: params.toString()
            });

            loading.classList.add("hidden");

            if (response.ok) {
                message.innerHTML = `
                <div class="bg-green-100 border border-green-300 text-green-800 rounded p-4">
                    Heuristics are prepared.
                </div>`;
            } else {
                message.innerHTML = `
                <div class="bg-red-100 border border-red-300 text-red-800 rounded p-4">
                    Request failed (${response.status}).
                </div>`;
            }

        } catch (e) {

            loading.classList.add("hidden");

            message.innerHTML = `
            <div class="bg-red-100 border border-red-300 text-red-800 rounded p-4">
                ${e.message}
            </div>`;
        }
    }

</script>

</body>
</html>
